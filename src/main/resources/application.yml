spring:
  application:
    name: ZuPu
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/zupu?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 5m
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  ai:
    openai:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7

server:
  servlet:
    session:
      timeout: 2h

jwt:
  # 生产环境务必更换为随机密钥（>= 32 字节）
  secret: ${JWT_SECRET:zupu-jwt-secret-please-change-me-in-production-2026}
  expiration: 7200000
  refresh-expiration: 604800000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.zupu.zupu.entity,com.zupu.zupu.model
  configuration:
    map-underscore-to-camel-case: true

app:
  upload:
    path: uploads/
  cors:
    # 允许跨域的前端来源，逗号分隔。生产环境请改为你的真实域名；
    # 留空表示不允许任何跨域（前端经 nginx 同源代理时无需配置）
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  security:
    # 是否启用内置演示账号（admin / demo，密码见 README）。
    # 生产环境请设为 false：启动时会自动禁用仍在使用默认密码的演示账号
    demo-accounts-enabled: ${DEMO_ACCOUNTS_ENABLED:true}
  ai:
    # 注入 system prompt 的家族成员上限，超出部分由 AI 通过工具按需查询
    max-prompt-members: ${AI_MAX_PROMPT_MEMBERS:200}

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql
