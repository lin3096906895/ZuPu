spring:
  application:
    name: ZuPu
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/zupu?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 5m
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  ai:
    openai:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7

server:
  servlet:
    session:
      timeout: 2h

jwt:
  # 生产环境务必更换为随机密钥（>= 32 字节）
  secret: ${JWT_SECRET:zupu-jwt-secret-please-change-me-in-production-2026}
  expiration: 7200000
  refresh-expiration: 604800000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.zupu.zupu.entity,com.zupu.zupu.model
  configuration:
    map-underscore-to-camel-case: true

app:
  upload:
    path: uploads/

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql
